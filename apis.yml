name: Mi Dulce Hogar
description: Mi Dulce Hogar is a professional home and commercial cleaning services
  company operating in Mexico City (CDMX), connecting customers with vetted, background-screened
  cleaning professionals. Services include residential and office cleaning, upholstery
  and carpet washing, floor polishing, and pest control/fumigation. The company states
  it has delivered more than 100,000 services and screens candidates through a rigorous
  criminological vetting process. Surfaced as a 500 Global portfolio company and added
  to the API Evangelist network as a lead; the public web presence is a consumer marketing
  and booking site with no public developer API, SDK, or documentation surface at this time.
